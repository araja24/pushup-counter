[project]
name = "pushform"
version = "0.1.0"
description = "PushForm backend: counts push-up reps from phone pose landmarks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pushform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Raised inside starlette.testclient itself; nothing we can act on here.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
